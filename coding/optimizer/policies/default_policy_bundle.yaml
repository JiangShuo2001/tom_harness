version: "0.1.0"
created_at: "auto"
description: "Non-invasive default policy bundle for HarnessRuntime v3"

route_gate_policy:

  default:
    skill: conditional
    rag: false
    memory: true
    validators: []

  false_belief:
    skill: true
    rag: false
    memory: true
    validators:
      - belief_state_checker

  faux_pas:
    skill: true
    rag: conditional
    rag_condition: needs_social_norm
    memory: true
    validators:
      - speaker_listener_awareness_checker

  scalar_implicature:
    skill: true
    rag: false
    memory: conditional
    validators:
      - scalar_consistency_checker

  ambiguous_social_cue:
    skill: true
    rag: conditional
    rag_condition: needs_social_norm
    memory: true
    validators:
      - actor_observer_checker
      - anti_overmentalizing_checker

  skill_policies:

    skill7_nonverbal_cue:
      positive_triggers:
        - smile gaze nod
        - nonverbal coordination
      negative_triggers:
        - what observer thinks
        - observer acts after others leave
      fallback_skill: observer_perspective_inference
      confidence_threshold: 0.72

prompt_compose_policy:

  global_token_budget: 3500

  priority:
    task_story: 100
    options: 100
    skill: 80
    memory: 60
    rag: 40
    validator_hint: 30
    default: 20

  module_budgets:
    skill: 700
    memory: 900
    rag: 500
    validator_hint: 300

  rules:
    preserve_original_story: true
    preserve_options: true
    drop_low_relevance_rag: true
    rag_min_relevance: 0.72
    memory_top_k: 3
    skill_as_hard_constraint_threshold: 0.85
    otherwise_skill_as_soft_hint: true
    add_anti_overmentalizing_instruction: true

rag_policy:

  false_belief:
    enabled: false

  faux_pas:
    enabled: true
    query_rewrite: "politeness norm + speaker awareness + listener feeling"
    top_k: 2
    require_relevance_score: 0.75

  ambiguous_social_cue:
    enabled: true
    query_rewrite: "nonverbal coordination cue + shared plan"
    top_k: 1
    require_relevance_score: 0.72

  knowledge_boundary:
    enabled: false

memory_policy:

  top_k: 3
  per_scene_top_k:
    false_belief: 2
    ambiguous_social_cue: 3

  entries: []

validator_policy:

  default:
    validators: []

  per_scene:
    false_belief:
      validators:
        - belief_state_checker
    ambiguous_social_cue:
      validators:
        - actor_observer_checker
        - anti_overmentalizing_checker

metadata:
  optimized_on:
    - ToMBench-search
  metrics:
    accuracy: null
    avg_tokens: null
    repair_count: null
    damage_count: null
  notes:
    - "This bundle is generated by the standalone optimizer and does not modify runtime code."
